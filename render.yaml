# Free submission demo. Local saves are ephemeral: export packages as backups.
# No service is created until you deploy this Blueprint in your Render account.
services:
  - type: web
    name: ignis-atlassia
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: FIREATLAS_DATA_DIR
        value: /tmp/fireatlas
      - key: FIREATLAS_AI_PROVIDER
        value: aiand
      - key: AIAND_API_KEY
        sync: false
      - key: PYDANTIC_AI_NO_BANNER
        value: "1"
