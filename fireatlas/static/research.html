<main class="lab-shell" id="main-content"><section class="workspace-heading"><p class="eyebrow">RESEARCH LAB</p><h1>Test assumptions. Keep the scope.</h1><p id="workspace-selection"></p><p>Paired comparisons and candidate grouping retain their own source-row contract.</p><p class="workspace-heading-actions"><a class="lab-button" data-context-link="./studio.html" href="./studio.html" id="research-studio-link">Create a research board ↗</a></p></section><div aria-label="Research Lab sections" class="workspace-tabs" role="tablist"><button aria-controls="workspace-panel" aria-selected="false" data-workspace-tab="comparison" id="workspace-tab-comparison" role="tab" tabindex="-1" type="button">Comparison</button><button aria-controls="workspace-panel" aria-selected="false" data-workspace-tab="candidates" id="workspace-tab-candidates" role="tab" tabindex="-1" type="button">Candidate Groups</button><button aria-controls="workspace-panel" aria-selected="false" data-workspace-tab="sensitivity" id="workspace-tab-sensitivity" role="tab" tabindex="-1" type="button">Sensitivity</button><button aria-controls="workspace-panel" aria-selected="false" data-workspace-tab="exposure" id="workspace-tab-exposure" role="tab" tabindex="-1" type="button">Exposure</button></div><section aria-live="polite" id="workspace-panel" role="tabpanel"></section><template id="template-comparison">
<nav aria-label="Research workflows" class="workspace-tabs"><a aria-current="page" data-context-link="" href="./research.html">Sensor overlap</a><a data-context-link="" href="./research-candidates.html">Candidates</a><a data-context-link="" href="./research-exposure.html">Exposure</a><a data-context-link="" href="./research-validation.html">Validation</a></nav>
<details class="study-editor" data-study-editor=""><summary><span aria-hidden="true" class="study-summary-icon">⌖</span><span class="study-summary-text"><strong>Selected observation study</strong><span class="study-summary-meta">Reading study settings…</span></span><span class="study-edit-label">Change study</span></summary><form aria-label="Research study setup" class="study-controls" id="overview-controls">
<label>Study year<select data-context-field="year" id="overview-year" required=""></select></label>
<label>Month<select data-context-field="month" id="overview-month" required=""></select></label>
<label class="wide">Area of interest · west,south,east,north<input data-context-field="bbox" id="overview-bbox" required="" value="-122,39,-120,41"/></label>
<label>Cutoff date<input data-context-field="as_of" id="overview-as-of" required="" type="date"/></label>
<button id="overview-run" type="submit">Run analysis ↗</button>
<details class="study-advanced"><summary>Grouping settings</summary><label>Distance threshold<select data-context-field="distance_km" id="overview-distance"><option value="0.5">0.5 km</option><option value="1">1 km</option><option selected="" value="2">2 km</option><option value="5">5 km</option><option value="10">10 km</option></select></label><label>Maximum date gap<select data-context-field="gap_days" id="overview-gap"><option value="0">Same day</option><option selected="" value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option><option value="7">7 days</option></select></label></details></form></details>
<div class="error-state" hidden="" id="overview-error" role="alert"></div>
<section aria-busy="true" aria-labelledby="overview-result-title" class="lab-panel" id="overview-result">
<div class="panel-heading"><div><p class="eyebrow">RESULT / DESCRIPTIVE ONLY</p><p id="overview-status">Run the study to load imported MODIS and VIIRS rows.</p></div><span class="status-tag unknown" id="overview-state">WAITING</span></div>
<div aria-label="Study headline values" class="status-grid"><article class="status-card"><span>Detected cell-days</span><strong id="overview-union">—</strong><small>Union of source detections on the shared 1 km grid.</small></article><article class="status-card"><span>Shared cell-days</span><strong id="overview-both">—</strong><small>Same grid cell and UTC date in both sources.</small></article><article class="status-card"><span>Candidate groups</span><strong id="overview-groups">—</strong><small>Connected samples under the selected assumptions.</small></article></div>
<section aria-labelledby="overview-chart-title" class="deep-panel"><div class="deep-panel-heading"><div><p class="eyebrow">DAILY PROFILE</p><h3 id="overview-chart-title">What was detected each UTC day?</h3><p>Bars show imported cell-days; they do not show observation exposure.</p></div><span class="status-tag unknown" id="overview-completeness">UNKNOWN</span></div><div aria-label="Research chart legend" class="semantic-legend" role="group"><div><h3>Observation meaning</h3><ul><li><i class="legend-swatch modis"></i> MODIS only</li><li><i class="legend-swatch shared"></i> Shared cell</li><li><i class="legend-swatch viirs"></i> VIIRS only</li></ul></div><details class="legend-status-details"><summary>Export status key</summary><div><h3>Data status</h3><ul><li><i class="legend-swatch complete"></i> Complete export</li><li><i class="legend-swatch partial"></i> Partial export</li><li><i class="legend-swatch unknown"></i> Unknown</li></ul></div></details><p class="legend-limit">The chart does not show fire boundaries, burned area, sensitivity, or continuous satellite coverage.</p></div><div aria-label="Interactive daily source counts, with an exact table below" class="overview-chart" id="overview-chart" role="group"></div><p class="chart-inspector" id="overview-chart-inspector" role="status">Select a day in the chart to inspect its source counts.</p></section>
<details class="daily-count-details"><summary>Exact daily counts and product versions</summary><div class="table-scroll"><table class="research-data-table"><thead><tr><th>UTC date</th><th>MODIS</th><th>VIIRS</th><th>Shared</th><th>Union</th></tr></thead><tbody id="overview-table"></tbody></table></div><p class="lab-muted" id="overview-versions"></p></details>
</section>
<section aria-labelledby="next-steps-title" class="lab-panel"><div class="panel-heading"><div><p class="eyebrow">CONTINUE THE STUDY</p><h2 id="next-steps-title">Choose one focused question.</h2><p>Each page keeps its own denominator, status, and caveat in view.</p></div></div><div class="destination-grid"><a class="destination-card" data-context-link="" href="./research-candidates.html"><span>01 / TRACK</span><strong>Candidate tracking ↗</strong><p>Inspect connected detection samples on a neutral NDVI map.</p><span>Groups are not confirmed incidents</span></a><a class="destination-card" data-context-link="" href="./research-exposure.html"><span>02 / MEASURE</span><strong>Observation exposure ↗</strong><p>Upload a matching mask and review source-specific denominators.</p><span>FIRMS alone cannot supply coverage</span></a><a class="destination-card" data-context-link="" href="./research-validation.html"><span>03 / QUALIFY</span><strong>Validation and limits ↗</strong><p>Review calibration, radar, spread-model, and independent-evidence gates.</p><span>Unvalidated claims stay separate</span></a><a class="destination-card" data-context-link="" href="./replay.html"><span>04 / REPLAY</span><strong>Historical observation replay ↗</strong><p>Move through local MODIS and VIIRS detections over satellite imagery and terrain context.</p><span>Observation sequence · no spread forecast</span></a></div></section>
<details class="lab-panel"><summary>What this overview can and cannot answer</summary><p class="lab-muted">It can compare imported detections by source, date, and shared cell. It cannot tell whether every overpass saw the AOI, convert detections into a perimeter, infer a fire cause, or estimate sensor sensitivity without matched overpasses and independent reference data. Open <a href="./method.html">Method</a> for the calculation details.</p></details>
<footer class="lab-footer"><span>✦ FIREATLAS / RESEARCH LAB</span><span>Exploratory methods · traceable assumptions · no operational forecasts</span><a data-context-link="" href="./atlas.html">Return to Atlas ↗</a></footer>
</template><template id="template-candidates">
<nav aria-label="Research workflows" class="workspace-tabs"><a data-context-link="" href="./research.html">Sensor overlap</a><a aria-current="page" data-context-link="" href="./research-candidates.html">Candidates</a><a data-context-link="" href="./research-exposure.html">Exposure</a><a data-context-link="" href="./research-validation.html">Validation</a></nav>
<details class="study-editor" data-study-editor=""><summary><span aria-hidden="true" class="study-summary-icon">⌖</span><span class="study-summary-text"><strong>Selected observation study</strong><span class="study-summary-meta">Reading study settings…</span></span><span class="study-edit-label">Change study</span></summary><form aria-label="Candidate study context" class="context-controls" id="deep-form"><label>Year<select data-context-field="year" id="deep-year"></select></label><label>Month<select data-context-field="month" id="deep-month"></select></label><label class="wide">AOI · west,south,east,north<input data-context-field="bbox" id="deep-bbox" value="-122,39,-120,41"/></label><label>Cutoff<input data-context-field="as_of" id="deep-as-of" type="date"/></label><button id="deep-run" type="submit">Run candidate analysis ↗</button><details class="study-advanced"><summary>Grouping settings</summary><label>Distance km<select data-context-field="distance_km" id="deep-distance"><option value="0.5">0.5</option><option value="1">1</option><option selected="" value="2">2</option><option value="5">5</option><option value="10">10</option></select></label><label>Date gap days<select data-context-field="gap_days" id="deep-gap"><option value="0">0</option><option selected="" value="1">1</option><option value="2">2</option><option value="3">3</option><option value="7">7</option></select></label></details></form></details>
<div class="error-state" hidden="" id="deep-error" role="alert"></div>
<section class="deep-panel"><div class="deep-panel-heading"><div><h2>Candidate groups</h2><p id="deep-status">Loading the selected study…</p></div><span class="status-tag unknown" id="deep-state">WAITING</span></div><div class="candidate-toolbar"><label>Sort candidates<select id="candidate-sort"><option value="first">Earliest date</option><option value="days">Detected days</option><option value="cells">Cell-days</option><option value="pixels">Raw pixels</option></select></label><button class="lab-button" id="candidate-fit" type="button">Fit all groups ↗</button></div><div aria-label="Candidate map legend" class="semantic-legend candidate-key" role="group"><span><i aria-hidden="true" class="candidate-neutral-mark"></i> Detected cell</span><span><i aria-hidden="true" class="candidate-selected-mark"></i> Selected candidate</span><p>Connected samples, not confirmed incidents or fire perimeters. Sensors are listed per group.</p></div><div class="candidate-workspace"><div class="candidate-map-wrap"><div aria-label="Candidate detection cells over NASA MODIS NDVI context" id="deep-map" role="application"></div><span class="map-label">NASA MODIS NDVI · CONTEXT ONLY</span></div><aside aria-labelledby="candidate-list-title" class="candidate-list-panel"><div class="panel-heading"><div><p class="eyebrow">SELECT A GROUP</p><h3 id="candidate-list-title">Candidate list</h3></div><span class="status-tag unknown" id="candidate-count">—</span></div><div class="candidate-list" id="candidate-list" role="list"></div></aside></div><p class="map-context-date" id="candidate-context-status" role="status">Loading the requested NASA vegetation composite…</p><section aria-live="polite" class="candidate-detail" id="candidate-detail"><div class="empty-state">Select a candidate to inspect its dates, cells, sensors, and original detection IDs.</div></section><details class="lab-panel"><summary>Accessible table fallback</summary><div class="table-scroll"><table class="research-data-table"><thead><tr><th>Candidate</th><th>Date range</th><th>Detected days</th><th>Cell-days</th><th>Raw pixels</th><th>Sources</th></tr></thead><tbody id="candidate-table"></tbody></table></div></details></section>
<footer class="lab-footer"><span>Candidate IDs change when membership changes.</span><a data-context-link="" href="./research-exposure.html">Next: observation exposure ↗</a></footer>
</template><template id="template-exposure"><nav aria-label="Research workflows" class="workspace-tabs"><a data-context-link="" href="./research.html">Sensor overlap</a><a data-context-link="" href="./research-candidates.html">Candidates</a><a aria-current="page" data-context-link="" href="./research-exposure.html">Exposure</a><a data-context-link="" href="./research-validation.html">Validation</a></nav><p class="notice-panel" hidden="" id="mask-handoff-notice" role="note">Coverage-mask uploads are not carried in study links for privacy and size reasons. Upload the mask again on this page.</p>
<div class="workflow-step-heading"><span>01 / MATCH THE STUDY</span><h2 id="exposure-context-title">Use the same area and dates</h2></div><details class="study-editor" data-study-editor=""><summary><span aria-hidden="true" class="study-summary-icon">⌖</span><span class="study-summary-text"><strong>Selected observation study</strong><span class="study-summary-meta">Reading study settings…</span></span><span class="study-edit-label">Change study</span></summary><form aria-label="Exposure study context" aria-labelledby="exposure-context-title" class="context-controls" id="deep-form"><label>Year<select data-context-field="year" id="deep-year"></select></label><label>Month<select data-context-field="month" id="deep-month"></select></label><label class="wide">AOI · west,south,east,north<input data-context-field="bbox" id="deep-bbox" value="-122,39,-120,41"/></label><label>Cutoff<input data-context-field="as_of" id="deep-as-of" type="date"/></label><button id="deep-run" type="submit">Match study context ↗</button></form></details>
<div class="error-state" hidden="" id="deep-error" role="alert"></div>
<section class="deep-panel"><div class="deep-panel-heading"><div><p class="eyebrow">STEP 01 / MATCH</p><h2>Study context</h2><p id="deep-status">Loading imported detections for the selected AOI and dates…</p></div><span class="status-tag unknown" id="deep-state">MASK REQUIRED</span></div><div class="status-grid"><article class="status-card"><span>Study detections</span><strong id="exposure-detections">—</strong><small>Imported pixels in the matched selection.</small></article><article class="status-card"><span>Mask status</span><strong id="exposure-mask-status">Unavailable</strong><small id="exposure-mask-note">No observation mask supplied.</small></article><article class="status-card"><span>Denominator rule</span><strong>Observed cell-days</strong><small>Cloud, no-pass, and unknown rows do not count as exposure.</small></article></div></section>
<section class="deep-panel"><div class="deep-panel-heading"><div><p class="eyebrow">STEP 02 / SUPPLY</p><h2>Upload or select a coverage mask</h2><p>The file must declare <code>fireatlas-coverage-v1</code>, the matching grid, dates, AOI, provenance, method, and source/cell/day statuses.</p></div></div><div class="destination-grid"><label class="destination-card"><span>USER-SUPPLIED</span><strong>Upload JSON</strong><p>Select a mask with matching context. It is validated for consistency, not scientific provenance.</p><input accept=".json,application/json" id="coverage-file" type="file"/></label><div class="destination-card"><span>SCHEMA EXAMPLE</span><strong>Download template</strong><p>Use this structure to prepare a mask. Empty templates cannot produce a rate.</p><button class="lab-button" id="coverage-example" type="button">Download schema ↗</button></div><div class="destination-card"><span>LOCAL RESULT</span><strong>Save current mask</strong><p>Download the exact mask sent to the local analysis service after a successful upload.</p><button class="lab-button" disabled="" id="coverage-download" type="button">Download current mask ↓</button></div></div><p class="notice-panel" id="mask-message" role="status">No mask supplied. Observation coverage remains unknown.</p></section>
<section class="deep-panel"><div class="deep-panel-heading"><div><p class="eyebrow">STEP 03 / REVIEW</p><h2>Source-specific exposure rates</h2><p>Percentages appear only when the source export is complete and a non-zero observed denominator is present.</p></div></div><div id="coverage-output"><div class="empty-state"><strong>Exposure is unknown.</strong><br/>Upload a matching mask to calculate rates.</div></div><div aria-label="Exposure legend" class="semantic-legend" role="group"><div><h3>Observation meaning</h3><ul><li><i class="legend-swatch modis"></i> MODIS denominator</li><li><i class="legend-swatch viirs"></i> VIIRS denominator</li><li><i class="legend-swatch shared"></i> Detected in mask</li></ul></div><div><h3>Data status</h3><ul><li><i class="legend-swatch unknown"></i> Unavailable / withheld</li><li><i class="legend-swatch selected"></i> User-supplied unvalidated</li></ul></div><p class="legend-limit">A rate does not describe the full AOI or prove that undetected cells were clear.</p></div></section>
<details class="lab-panel"><summary>Mask contract and interpretation</summary><p class="lab-muted">A cell-day is observed only when upstream processing establishes usable observation of that cell. A detection marked cloud, no-pass, or unknown is rejected as a conflict. Missing mask rows remain unknown. Synthetic masks are labelled separately and cannot be mixed with authentic detections.</p></details>
<footer class="lab-footer"><span>FIRMS detections do not supply an observation denominator.</span><a data-context-link="" href="./research-validation.html">Next: validation and limits ↗</a></footer></template><template id="template-sensitivity"><section class="lab-panel"><p class="eyebrow">THRESHOLD SENSITIVITY</p><h2>How much does grouping depend on the thresholds?</h2><p>Run up to nine bounded configurations around the applied distance and date gap. These are candidate groups, not confirmed incidents.</p><button id="sensitivity-run" type="button">Run stored-data sensitivity</button><p id="sensitivity-status" role="status">The local scientific service is required. No model is used.</p><div class="table-scroll" id="sensitivity-output"></div></section></template></main>
