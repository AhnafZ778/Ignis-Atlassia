[project]
name = "fireatlas"
version = "0.1.0"
description = "Sensor-aware NASA FIRMS burning calendar prototype"
requires-python = ">=3.10"
dependencies = [
    "pyproj>=3.4,<4",
    "pyshp>=2.3,<3",
]

[project.optional-dependencies]
masks = ["numpy>=1.24,<3"]
assistant = ["pydantic-ai-slim[openai,google,mcp,ag-ui]==2.53.0; python_version >= '3.12'", "fastmcp-slim[client,server]==4.0.10; python_version >= '3.12'", "mcp==2.2.0; python_version >= '3.12'", "starlette==1.7.0; python_version >= '3.12'", "uvicorn==0.54.0; python_version >= '3.12'"]

[project.scripts]
fireatlas = "fireatlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fireatlas*"]

[tool.setuptools.package-data]
fireatlas = ["static/*", "static/vendor/*", "static/fonts/*", "static/incident-media/*", "samples/*", "assistant/system.md"]
