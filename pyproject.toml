[project]
name = "fireatlas"
version = "0.1.0"
description = "Sensor-aware NASA FIRMS burning calendar prototype"
requires-python = ">=3.10"
dependencies = ["pyproj>=3.4,<4"]

[project.scripts]
fireatlas = "fireatlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fireatlas*"]

[tool.setuptools.package-data]
fireatlas = ["static/*", "static/vendor/*", "static/fonts/*"]
