name: Publish the verified static FireAtlas bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  integrity:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: integrity
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed bundle
        uses: actions/checkout@v4
      - name: Reassemble verified regional archives
        run: python3 scripts/static_bundle_storage.py --site site --prune-parts
      - name: Record the published revision
        env:
          PUBLISHED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('site/deployment.json').write_text(json.dumps({'commit': os.environ['PUBLISHED_SHA']}) + '\n')
          PY
      - name: Verify publication size and frozen evidence
        run: python3 scripts/check_pages_release.py --site site
      - name: Install browser verification tools
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.10.7
          python-version: '3.12'
      - name: Install Chromium
        run: uv run --with playwright python -m playwright install --with-deps chromium
      - name: Verify the website under a project URL
        run: uv run --with playwright python scripts/verify_workspaces.py --output "$RUNNER_TEMP/pages-checks"
      - name: Verify bundled historical evidence
        run: |
          uv run --with playwright python scripts/verify_static_method.py --site site --case park-2024
          uv run --with playwright python scripts/verify_static_method.py --site site --case grove-2025
      - name: Verify the landing globe under the repository URL
        env:
          PAGES_PREFIX: /${{ github.event.repository.name }}/
        run: uv run --with playwright python scripts/verify_static_globe.py --site site --prefix "$PAGES_PREFIX"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static bundle
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
