<details class="archive-source-details"><summary>NOAA HMS archive · separate source</summary><section aria-labelledby="noaa-source-title" class="noaa-source"><div><p class="eyebrow">HISTORICAL SATELLITE ARCHIVE / NOAA</p><h2 id="noaa-source-title">The real fire season,<br/><em>ready to explore.</em></h2><p>NOAA's Hazard Mapping System daily archive supplies historical VIIRS fire points over North America. Ignis-Atlassia checks every day of a month before showing it as a complete source export, preserves the original archive hashes, and keeps this source distinct from NASA FIRMS.</p><a href="./atlas.html?series=hms-viirs&amp;year=2024&amp;month=7&amp;bbox=-122%2C39%2C-120%2C41#calendar-section" id="noaa-open">Explore authentic July 2024 ↗</a></div><div class="noaa-stat"><span id="noaa-state">CHECKING ARCHIVE</span><strong id="noaa-count">—</strong><small>VIIRS DETECTIONS IMPORTED</small><div class="noaa-years" id="noaa-years">Checking verified months…</div></div></section></details>

<div class="data-section-heading"><p class="eyebrow">WHAT TO DOWNLOAD</p><h2 id="download-paths-title">One CSV path. No GIS conversion.</h2><p>The atlas uses detection rows. Shapefiles, KML, and WMS from NASA’s Active Fire page are alternate views of the data; you do not need to download them for Ignis-Atlassia.</p></div>
<div class="download-grid">
<article><span>01 / AUTOMATIC</span><h3>Use the harvester</h3><p>The pilot sync fetches MODIS and VIIRS CSV through NASA’s Area API in five-day windows, then verifies each complete month. Your existing MAP_KEY stays on this server. It tries the primary service, then FIRMS2 for transport or server failures.</p><a href="https://firms2.modaps.eosdis.nasa.gov/api/area/" rel="noopener noreferrer" target="_blank">NASA Area API ↗</a></article>
<article><span>02 / IF THE API IS DOWN</span><h3>Download a CSV</h3><p>Use NASA’s Active Fire text files for recent detections, or Archive Download for older and complete-month exports. NASA may ask for Earthdata Login or an email code. Import the CSV below; short 24-hour, 48-hour, or 7-day files remain partial.</p><div class="download-links"><a href="https://firms2.modaps.eosdis.nasa.gov/active_fire/" rel="noopener noreferrer" target="_blank">Recent CSV ↗</a><a href="https://firms2.modaps.eosdis.nasa.gov/download/" rel="noopener noreferrer" target="_blank">Archive Download ↗</a></div></article>
<article><span>03 / INCLUDED DATA</span><h3>Explore the two-region archive</h3><p>Request-verified standard FIRMS exports cover both study areas from July 2022 onward, with incomplete months kept partial or unknown. Owner-supplied historical detections extend MODIS to July 2006 and Suomi NPP to July 2012. Those older inputs are row-only: they show positive detections but do not establish complete request coverage, so empty months remain unknown.</p><a href="./atlas.html#harmonized-calendar">Open the harmonized calendar ↗</a></article>
<article><span>04 / HISTORICAL EXTENSION</span><h3>Load the longer windows</h3><p>Use one sidecar per downloaded CSV, then run the local importer. The app clips each authentic standard archive into both target areas and reports actual complete months.</p><a href="./docs/NASA_DATA_IMPORT.md">Open the import recipe ↗</a></article>
<article><span>05 / LOADED LAGGED CHECK</span><h3>MCD64A1 burned area</h3><p>MCD64A1 Collection 6.1 monthly Burn Date and companion QA rasters. Retrieved and imported locally on 2026-09-30 from the University of Maryland fuoco SFTP archive (user guide §4). The calendar shows mapped pixels for matching months; this is lagged burned-area context, not active-fire truth, a pass mask, a cloud mask, or a fire perimeter. Independent review remains pending.</p><p>All 12 supplied Burn Date/QA pairs are inventoried: six support the California and Punjab–Haryana case months; six cover areas outside those demo footprints. Official Collection 6.1 QA rules now retain burned dates only on land with valid data; full-period unburned counts also require a full mapping period, no contextual relabeling, and no special condition. Same-date shared-grid counts are descriptive only: MCD64A1 uses active-fire data in its algorithm, and no match cannot establish fire absence. Independent review remains pending.</p><a download="" href="./data/v2/validity/mcd64-inputs.zip">Download all 24 MCD64A1 TIFF inputs ↓</a> · <a download="" href="./data/v2/validity/mcd64-corroboration.json">Download evidence report ↓</a> · <a href="https://doi.org/10.5067/MODIS/MCD64A1.061" rel="noopener noreferrer" target="_blank">NASA product record ↗</a> · <a href="https://lpdaac.usgs.gov/documents/1006/MCD64_User_Guide_V61.pdf" rel="noopener noreferrer" target="_blank">Collection 6.1 QA guide ↗</a><details><summary>Six case-month checks · 12 input TIFF fingerprints (SHA-256)</summary><ul><li>Park Fire · 2024-07: Burn Date <code>MCD64monthly.A2024183.Win03.061.burndate.tif</code> <code>62ab309365ceaa8cc29fa5fc9a1d47763c4c7bce82ce8262b67bf8ca29450a9b</code>; QA <code>MCD64monthly.A2024183.Win03.061.ba_qa.tif</code> <code>9f1e0c4a66d72807c384fc956a3a6d7adce641e06691e761d6a9fdc6d1c08cc2</code>.</li><li>Park Fire · 2024-08: Burn Date <code>MCD64monthly.A2024214.Win03.061.burndate.tif</code> <code>5dae40a783fdb00c72484518ae6c7483176c034c323309209699ad947579ab58</code>; QA <code>MCD64monthly.A2024214.Win03.061.ba_qa.tif</code> <code>791c631328db16bdc781a8d27173a1a2beae3bef8f9ee6f258d18b688fe87f98</code>.</li><li>Grove · 2025-07: Burn Date <code>MCD64monthly.A2025182.Win03.061.burndate.tif</code> <code>dd76c0f04a9d144a61016fd8c72b07e65b779f9e4bf10b9f787410bd0847aecc</code>; QA <code>MCD64monthly.A2025182.Win03.061.ba_qa.tif</code> <code>11edb36a9d3d2456d9ac15599ed548bea116c9aa1ef66a7e082a16c8350072e1</code>.</li><li>Grove · 2025-08: Burn Date <code>MCD64monthly.A2025213.Win03.061.burndate.tif</code> <code>dbada417416ea7d691e829a1fd64b9eb94f122613495893fc34c9733f352579a</code>; QA <code>MCD64monthly.A2025213.Win03.061.ba_qa.tif</code> <code>d3bd2117f17773de83b154bcfd34838f715939927c02aa0265517899901ddbb9</code>.</li><li>Punjab–Haryana · 2024-07: Burn Date <code>MCD64monthly.A2024183.Win18.061.burndate.tif</code> <code>f6c17763dbd2b528cdfcf548a9ca27f2b112264debc8bc39593b8272f7a92263</code>; QA <code>MCD64monthly.A2024183.Win18.061.ba_qa.tif</code> <code>01cbe616f695d418960560f0d099bb952fdc14f89a8e3e88cb1a6282d1857759</code>.</li><li>Punjab–Haryana · 2025-07: Burn Date <code>MCD64monthly.A2025182.Win18.061.burndate.tif</code> <code>5d3f776a813a96e5b06d4f12daa1bcf1f157cfd13bc5b6fbe3afe11fbf1e4424</code>; QA <code>MCD64monthly.A2025182.Win18.061.ba_qa.tif</code> <code>b6909cf29c020911ca77877fad38138299e3cb28fd8776063fd703065a3e3d5d</code>.</li></ul></details></article>
</div>
<details class="download-recipe"><summary>Target archive periods and what is still pending</summary><p>For both areas, the row-only positive detections begin <strong>2006-07</strong> for MODIS and <strong>2012-07</strong> for Suomi NPP; request-metadata verified coverage begins in <strong>July 2022</strong> and continues through the latest complete standard archive window. Row-only history does not establish continuous coverage, and missing dates remain unknown. The live ledger below distinguishes those targets from files actually imported. Partial 2026 months stay visible as partial and are not treated as full-year comparisons.</p><p>Use exact request dates and the requested area in each sidecar. A world-area request can feed both study boxes. Make adjacent one-year requests if FIRMS limits the date range; the importer marks a month complete only when the whole month and study box are covered. Product versions are read from source rows when possible; never guess a version.</p><p>No additional dataset is required for the FIRMS detection calendar. Native satellite fire masks and geolocation are needed only to claim cell-level pass, cloud, or clear-sky coverage. See the <a href="./docs/NASA_DATA_IMPORT.md">full local import instructions</a>.</p></details>
</section></details>
<details><summary>Study regions &amp; pilot import status</summary><section class="pilot-section" id="study-regions"><div class="data-section-heading"><p class="eyebrow">01 / NASA FIRMS PILOT</p><h2>Two places. A comparable window.</h2><p>July 2025 MODIS/VIIRS source exports and July 2022–2024 baseline exports are available in the bundled regional archive. The cards below show this server's actual import status. Geographic areas are exploratory; land cover and individual incidents have not been classified.</p></div><div class="pilot-grid" id="pilot-list"></div></section></details>
<details><summary>Reproducibility checks for the pilot imports</summary><section class="validation-section-data"><div class="data-section-heading"><p class="eyebrow">03 / VALIDATION</p><h2>Reproduce first. Then investigate.</h2></div><div class="validation-output" id="pilot-validation">Pilot checks will appear after both sources and their baseline years have been imported.</div><p class="data-footnote">Reproducing cell-day counts establishes pipeline consistency. Calibrated sensor sensitivity, exposure-adjusted rates and regional fire classification still require independent reference data and validated masks.</p></section></details>
<section class="data-reference-panel" id="data-references"><div class="data-section-heading"><p class="eyebrow">REPRODUCE &amp; INSPECT</p><h2>Evidence files and source documentation</h2><p>Download the records, aggregate bundles, calibration reports and native-file fingerprints.</p></div><div class="data-ai-note" id="ai-use-summary"><span class="eyebrow">AI USE &amp; REVIEW</span><p>AI assistance helped with code and documentation; it did not generate NASA observation rows or their counts. The application computes calendar values from imported CSV rows. No independent scientific reviewer is recorded yet, so numerical review remains pending.</p><p>NASA FIRMS acknowledgement: “We acknowledge the use of imagery from the NASA LANCE FIRMS (https://earthdata.nasa.gov/firms), part of the NASA Earth Science Data and Information System (ESDIS).” NASA data are separate from the repository code license. <a href="https://www.earthdata.nasa.gov/engage/open-data-services-software/data-use-policy" rel="noopener noreferrer" target="_blank">NASA data use and citation guidance ↗</a></p></div><details class="archive-ledger-link"><summary>Source versions, request dates and file fingerprints</summary><p>The committed bundle contains MODIS Terra/Aqua Collection 6.1 and VIIRS Suomi NPP Collection 2 (375 m) rows for Northern California from July 2022 through June 2026. Locally imported archives may extend the ranges shown above. The detailed parent filenames, request IDs, exact date windows and SHA-256 values are in the <a href="./docs/DATA.md">NASA data ledger ↗</a>.</p><p>The source is NASA FIRMS <a href="https://firms.modaps.eosdis.nasa.gov/download/" rel="noopener noreferrer" target="_blank">Archive Download ↗</a>. NASA data are not covered by the project’s Apache-2.0 code license.</p></details><p class="data-footnote"><strong>Reproducible daily bundles:</strong> 47 verified paired months · 1,430 UTC days · type 0 or missing · 1 km cells. May 2026 and row-only years are omitted from these summaries. <a download="" href="./samples/aggregates/norcal.json.gz">Northern California ↓</a> · <a download="" href="./samples/aggregates/punjab-haryana.json.gz">Punjab–Haryana ↓</a></p><p class="data-footnote"><strong>Version-matched calibration reports:</strong> nested held-out estimates, fixed candidate references, daily and seasonal synthetic-gap metrics, eligible month totals, and parent-file hashes. Prediction intervals are withheld because independent calibration is unsupported; the 2012 step remains untested where source windows are row-only. <a download="" href="./samples/calibration/norcal.json">Northern California JSON ↓</a> · <a download="" href="./samples/calibration/punjab-haryana.json">Punjab–Haryana JSON ↓</a></p><p class="data-footnote"><strong>Complete imported observation records:</strong> these downloads include every non-demo row imported inside each study-area box, across all source IDs, with the original row fields and source-file fingerprints. The daily browser drill-down is a compact preview; use the deterministic parts for row-level analysis. <a download="" href="./data/v2/observations-full/norcal.part-01.jsonl.gz">Northern California part 01 ↓</a> · <a download="" href="./data/v2/observations-full/punjab-haryana.part-01.jsonl.gz">Punjab–Haryana part 01 ↓</a> · <a download="" href="./data/v2/observations-full/punjab-haryana.part-02.jsonl.gz">part 02 ↓</a> · <a download="" href="./data/v2/observations-full/punjab-haryana.part-03.jsonl.gz">part 03 ↓</a> · <a download="" href="./data/v2/observations-full/punjab-haryana.part-04.jsonl.gz">part 04 ↓</a> · <a download="" href="./data/v2/observations-full/punjab-haryana.part-05.jsonl.gz">part 05 ↓</a></p><p class="data-footnote"><strong>Native mask downloads:</strong> the local app can download each supplied NASA HDF/NetCDF file directly. The static release includes the complete fingerprint inventory and NASA source URLs where recorded; the 8.7 GiB of native binaries remain in the local project folder. <a download="" href="./data/v2/validity/fire-mask-download-checklist.csv">Download NASA source checklist ↓</a> · <a download="" href="./data/v2/validity/fire-mask-local-inventory.csv">Download all local file fingerprints ↓</a> · <a download="" href="./data/v2/manifest.json">Download complete archive manifest ↓</a></p><details id="native-mask-downloads"><summary>Checking local native file downloads…</summary><p id="native-mask-status">Loading local NASA file inventory…</p><ul id="native-mask-file-list"></ul></details><details class="source-advisories"><summary>Captured NASA advisories &amp; satellite continuity notes</summary><aside aria-label="NASA service advisories" class="source-notices">
<article><span class="notice-tag">FIRMS2 / SERVICE NOTICE</span><h3 id="maintenance-title">Maintenance announced for September 25–30, 2026</h3><p id="maintenance-copy">Archived notice captured September 27, 2026 for the September 25–30 maintenance window. This dated advisory is not a current service-status check. Use the connection panel for this server’s latest check.</p><small>Notice captured September 27, 2026 · <a href="https://firms2.modaps.eosdis.nasa.gov/active_fire/" rel="noopener noreferrer" target="_blank">Check NASA’s latest notice ↗</a></small></article>

<details class="method-details"><summary>Counting rules &amp; historical comparison limits <span>↗</span></summary><ol><li>Keep product, platform, version, native confidence and original CSV fields.</li><li>Count FIRMS type 0 or missing across confidence levels. Other types remain inspectable but are excluded from calendar totals.</li><li>Use the acquisition date in UTC. Assign the centroid to a 1 km EPSG:6933 cell.</li><li>Count each cell once per UTC day across the selected sources. Sum daily counts for the month.</li><li>Incomplete exports remain partial or unknown. Complete exports do not prove clear passes.</li><li>Prior-year medians require three complete same-month exports with the same source cohort and area. Product-version differences make the comparison descriptive.</li></ol><p>Hotspots are thermal anomalies. Cell-days are not burned area, perimeters, fire counts or calibrated fire risk.</p><a href="./data.html#nasa-source-ledger">Full dataset inventory ↗</a></details>

</template><template id="template-method"><section class="lab-panel" id="data-flow"><p class="eyebrow">METHOD / COMMON CENTROID GRID</p><h2>Two metrics, two reproducible contracts.</h2><table class="research-data-table"><thead><tr><th>Metric</th><th>Meaning</th><th>Exact export</th></tr></thead><tbody><tr><td>Harmonized activity</td><td>VIIRS-equivalent active-fire cell-days. Observed S-NPP or permitted MODIS-scaled values.</td><td>Regional study v1</td></tr><tr><td>Combined detections</td><td>Daily union of eligible MODIS / S-NPP occupied common cells.</td><td>Generic study v2</td></tr></tbody></table><p>Original centroids → EPSG:6933 → floor(x / 1000), floor(y / 1000) → unique source cells per UTC day → the selected metric.</p><details><summary>Eligibility, unknowns and processing interruption</summary><p>Calendar and replay include FIRMS type 0 or missing, with all native confidence levels. Replay additionally removes source aliases. Research uses all selected standard rows. Counts are not physical fires or burned area.</p><p>Regional totals remain null if any required daily value is unknown. Missing S-NPP exports are not automatically filled. Only the pre-S-NPP interval and documented interruption dates allow MODIS scaling, requiring complete exports, exact versions and an available fitted model.</p><p>The S-NPP interruption intersects July 24–29, 2024, from 05:24 UTC on the first date to 15:18 UTC on the last date. A complete collected export does not establish cloud-free observation opportunity.</p></details><details><summary>Supported prior-year comparisons</summary><p>Comparable prior same-month years must match source composition, versions and observed/estimated day counts. Median and difference require three prior years; percentile requires ten. A missing percentile does not invalidate an available median.</p></details><section id="research-validation"><h3>Research assumptions</h3><p>Geodesic threshold grouping is exploratory. Transitive connections can merge incidents; absent records can split them. Supplied-mask schema validation does not validate exposure scientifically. Source-specific observed denominators remain separate.</p><a data-context-link="evidence.html?tab=validity" href="./evidence.html?tab=validity">Inspect native evidence and independent-review gates →</a></section></section></template></main>
